name: Backend CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Avoid long queues from many small direct-to-main commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax checks
        run: |
          node --check index.js
          node --check routes/handler.js
          node --check controller/refreshController.js
          node --check controller/logoutController.js
          node --check controller/authSession.js
          node --check controller/userDashboard.js
          node --check middleware/authMiddleware.js
          node --check services/upmindService.js
          node --check utils/sendOtpToPhone.js
          node --check utils/sendOtpToEmail.js
